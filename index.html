<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Experimental · Webcam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0b0f; font-family: 'Inter', sans-serif; color: #eee;
      overflow-x: hidden; line-height: 1.4;
    }
    .header {
      position: fixed; top: 0; left: 0; width: 100%; background: #000; color: white;
      padding: 1rem 1.5rem; z-index: 100; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .name {
      font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 400;
      font-size: 1.8rem; letter-spacing: -0.04em; margin: 0; text-decoration: none; color: white;
    }
    .header nav { display: flex; gap: 1.2rem; }
    .nav-icon {
      color: rgba(255,255,255,0.8); font-size: 1.4rem;
      transition: color 0.3s, transform 0.3s; text-decoration: none;
    }
    .nav-icon:hover { color: #ffaa33; transform: scale(1.2); }

    #p5-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    #p5-camera-container { position: relative; z-index: 20; max-width: 800px; margin: 100px auto 40px; padding: 0 1rem; text-align: center; }

    .content-box {
      background: rgba(15, 15, 15, 0.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      padding: 2rem; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px;
    }
    .content-box h2 {
      font-family: 'Space Grotesk', sans-serif; font-weight: 400; font-size: 2rem;
      margin-bottom: 1rem; letter-spacing: -0.02em; text-transform: uppercase;
    }
    .content-box p { font-size: 1.05rem; font-weight: 300; margin-bottom: 1.5rem; line-height: 1.4; letter-spacing: -0.01em; }

    #camera-btn {
      background: transparent; color: #ffaa33; border: 1px solid #ffaa33;
      padding: 0.8rem 2rem; font-size: 1rem; cursor: pointer; transition: all 0.3s;
      margin-bottom: 1.5rem; font-family: inherit;
    }
    #camera-btn:hover { background: #ffaa33; color: #000; }

    #p5-camera { display: flex; justify-content: center; }
    #p5-camera canvas { max-width: 100%; height: auto !important; border: 1px solid rgba(255,255,255,0.2); }

    .footer {
      position: fixed; bottom: 0; width: 100%; z-index: 100; background: #000; color: #fff;
      padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: center;
      font-weight: 300; border-top: 1px solid rgba(255,255,255,0.2); text-align: center;
    }
    .footer p { font-size: 0.8rem; letter-spacing: 0.05em; }

    @media (max-width: 768px) {
      .header { padding: 0.8rem 1rem; }
      .name { font-size: 1.3rem; }
      .nav-icon { font-size: 1.15rem; }
      .header nav { gap: 0.8rem; }
      #p5-camera-container { margin-top: 80px; }
      .content-box { padding: 1.5rem 1rem; }
      .content-box h2 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div id="p5-background"></div>

  <header class="header">
    <a href="index.html" class="name">Antonio Ponce</a>
    <nav>
      <a href="index.html" class="nav-icon" title="Inicio"><i class="fas fa-home"></i></a>
    </nav>
  </header>

  <div id="p5-camera-container">
    <div class="content-box">
      <h2>Video Experimental</h2>
      <p>Activa tu cámara para generar un retrato en tiempo real con un filtro de píxeles y estática. Esta pieza juega con el error (glitch) y la identidad digital.</p>
      <button id="camera-btn">Activar Cámara</button>
      <div id="p5-camera"></div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 · Portafolio experimental</p>
  </footer>

  <script>
    let bgSketch = function(p) {
      p.setup = function() {
        let canvas = p.createCanvas(p.windowWidth, p.windowHeight);
        canvas.parent('p5-background');
        canvas.style('pointer-events', 'none');
        p.background(0);
      };
      p.draw = function() {
        p.background(0, 0, 0, 10);
        p.strokeWeight(1);
        for (let i = 0; i < 150; i++) {
          let bright = p.random(100, 255);
          p.stroke(bright, bright, bright, 60);
          p.point(p.random(p.width), p.random(p.height));
        }
      };
      p.windowResized = function() { p.resizeCanvas(p.windowWidth, p.windowHeight); };
    };
    new p5(bgSketch);

    let cameraSketch = null;
    const btn = document.getElementById('camera-btn');
    const container = document.getElementById('p5-camera');

    btn.addEventListener('click', async () => {
      if (cameraSketch) return;
      btn.style.display = 'none';

      let div = document.createElement('div');
      div.id = 'canvas-wrapper';
      container.appendChild(div);

      try {
        cameraSketch = new p5(function(p) {
          let video;
          p.setup = function() {
            let canvas = p.createCanvas(500, 375);
            canvas.parent('canvas-wrapper');
            video = p.createCapture(p.VIDEO);
            video.size(500, 375);
            video.hide();
          };

          p.draw = function() {
            p.image(video, 0, 0, p.width, p.height);
            
            p.loadPixels();
            for (let y = 0; y < p.height; y += 4) {
              for (let x = 0; x < p.width; x += 4) {
                let index = (x + y * p.width) * 4;
                if (p.random() < 0.1) {
                  p.pixels[index] = p.pixels[index + 4] || p.pixels[index];
                  p.pixels[index + 1] = p.pixels[index + 1000] || p.pixels[index + 1];
                  p.pixels[index + 2] = p.pixels[index - 4] || p.pixels[index + 2];
                }
              }
            }
            p.updatePixels();

            if (p.mouseX > 0 && p.mouseX < p.width && p.mouseY > 0 && p.mouseY < p.height) {
              p.stroke(255, 255, 0, 150);
              p.strokeWeight(2);
              p.line(p.mouseX, 0, p.mouseX, p.height);
              p.line(0, p.mouseY, p.width, p.mouseY);
            }
          };
        });
      } catch (err) {
        alert('No se pudo acceder a la cámara. Asegúrate de dar los permisos necesarios.');
        btn.style.display = 'block';
        btn.innerText = 'Reintentar';
      }
    });
  </script>
</body>
</html>
